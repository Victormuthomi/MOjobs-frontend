server {
  listen 80;                           # Listen on port 80
  server_name localhost;              # Hostname (can change this in production)

  root /usr/share/nginx/html;         # Where Vite static build is served from
  index index.html;                   # Default entry file

  location / {
    try_files $uri $uri/ /index.html; # Important for SPA fallback
  }
}

