version: "3.9"

services:
  frontend:
    build:
      context: . # No ./frontend — build from root
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules # Avoid overwriting node_modules
    environment:
      - VITE_API_URL=http://backend:8000/api
    container_name: ajirinow-frontend-dev
    #   depends_on:
    # - backend

